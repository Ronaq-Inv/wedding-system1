    <!-- [تم الاحتفاظ بنفس التنسيقات السابقة للحفاظ على الشكل] -->
    <style>
        :root { --pink: #fdf2f2; --gold: #c5a059; --dark-gold: #b38b7d; --black: #1a1a1a; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--pink); margin: 0; padding: 0; direction: rtl; }
        .container { width: 95%; max-width: 900px; margin: auto; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(197, 160, 89, 0.1); text-align: center; border-top: 5px solid var(--gold); }
        .hidden { display: none !important; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        button { cursor: pointer; padding: 12px; border-radius: 10px; border: none; font-weight: bold; width: 100%; background: var(--gold); color: white; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-label { display: block; text-align: right; font-weight: bold; margin-top: 10px; }
    </style>
</head>

<!-- [الجزء الخاص بالتأسيس - إضافة التشيك بوكس] -->
<div class="card" id="admin-create-card">
    <h3>🎀 تأسيس حفل جديد</h3>
    <input id="c-name" placeholder="اسم المستخدم">
    <input id="c-pass" type="password" placeholder="كلمة المرور">
    <input id="c-phone" placeholder="رقم جوال العميل">
    <input id="c-event" placeholder="اسم المناسبة">
    <label style="display:flex; align-items:center; margin: 10px 0;">
        <input type="checkbox" id="c-enable-code" checked style="width:20px; margin-left:10px;"> تفعيل كود الدخول للضيوف (QR Code)
    </label>
    <button id="save-client">إنشاء الحساب</button>
</div>

<!-- [الجزء الخاص بمودال التعديل] -->
<div id="edit-client-modal" class="modal-overlay hidden">

        <label style="display:flex; align-items:center; margin: 10px 0;">
            <input type="checkbox" id="ec-enable-code" style="width:20px; margin-left:10px;"> تفعيل كود الدخول (QR)
        </label>
        <button id="confirm-client-update">حفظ التغييرات</button>
        <button onclick="document.getElementById('edit-client-modal').classList.add('hidden')" style="background:none; color:red;">إلغاء</button>
    </div>
</div>
